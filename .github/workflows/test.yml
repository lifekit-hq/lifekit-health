name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-suites:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [workout, life-state]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: ${{ matrix.pkg }}
      - run: npm test
        working-directory: ${{ matrix.pkg }}

  nutrition-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
        working-directory: nutrition
      - run: npm run build
        working-directory: nutrition
      - run: npm test
        working-directory: nutrition
